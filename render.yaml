# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service (must stay at ONE instance) + an external MySQL 8+ database.
services:
  - type: web
    name: scalive-quiz-arena
    runtime: node
    plan: free               # sleeps after ~15 min idle: open the site a few minutes before class (or upgrade to starter)
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # mysql://USER:PASSWORD@HOST:3306/DATABASE
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # you will be prompted for it
      - key: PUBLIC_URL
        sync: false          # e.g. https://scalive-quiz-arena.onrender.com or your own domain
